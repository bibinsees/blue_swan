<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blue Schwan – Register</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: sans-serif;
      background: #f5f5f5;
      color: #111;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      padding: 32px 28px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
    }
    .logo {
      font-size: 1.6rem;
      font-weight: 800;
      color: #f97316;
      margin-bottom: 4px;
      letter-spacing: -0.02em;
    }
    h1 {
      font-size: 1.1rem;
      margin-bottom: 6px;
      color: #111;
      font-weight: 600;
    }
    .subtitle {
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 28px;
    }
    label {
      display: block;
      font-size: 0.78rem;
      color: #666;
      margin-bottom: 6px;
      margin-top: 18px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 600;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      background: #fafafa;
      border: 1px solid #ddd;
      border-radius: 8px;
      color: #111;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus { border-color: #f97316; background: #fff; }
    .error {
      background: #fff5f5;
      border: 1px solid #fca5a5;
      color: #dc2626;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 16px;
    }
    button {
      margin-top: 28px;
      width: 100%;
      padding: 14px;
      background: #f97316;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #ea580c; }
    button:active { background: #c2410c; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Blue Schwan</div>
    <h1>Challenge</h1>
    <p class="subtitle">Fill in your details to start playing.</p>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/register">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" required placeholder="e.g. Alexander the Great" />

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required placeholder="King@Macedon.com" />

      <label for="organisation">Firma / Organisation</label>
      <input type="text" id="organisation" name="organisation" required placeholder="e.g. Greek" />

      <button type="submit">Start Playing →</button>
    </form>
  </div>
</body>
</html>
