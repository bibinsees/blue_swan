<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blue Schwan – Register</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: sans-serif;
      background: #0f0f0f;
      color: #f0f0f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 32px 28px;
      width: 100%;
      max-width: 420px;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 6px;
      color: #fff;
    }
    .subtitle {
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 28px;
    }
    label {
      display: block;
      font-size: 0.8rem;
      color: #aaa;
      margin-bottom: 6px;
      margin-top: 18px;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      color: #f0f0f0;
      font-size: 1rem;
      outline: none;
    }
    input:focus { border-color: #555; }
    .error {
      background: #3a1010;
      border: 1px solid #7a2020;
      color: #f88;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 16px;
    }
    button {
      margin-top: 28px;
      width: 100%;
      padding: 14px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:active { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Blue Schwan Challenge</h1>
    <p class="subtitle">Fill in your details to start playing.</p>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/register">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" required placeholder="e.g. promptmaster42" />

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required placeholder="you@example.com" />

      <label for="phone">Mobile Number</label>
      <input type="tel" id="phone" name="phone" required placeholder="+49 123 456789" />

      <button type="submit">Start Playing →</button>
    </form>
  </div>
</body>
</html>
